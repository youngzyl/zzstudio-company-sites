name: Deploy to GitHub Pages

# Static site — no build step. The workflow just publishes the repository root.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never run two deploys at once, but let queued runs finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only the runtime files, so build templates (tools/), the README
      # and the CI config never end up at a public URL.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html solutions.html about.html contact.html 404.html \
             styles.css main.js og.png robots.txt sitemap.xml \
             CNAME .nojekyll _site/
          find _site -type f | sort

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
