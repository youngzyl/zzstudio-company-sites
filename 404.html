  body.zz-fallback a { color: #b8532f; }
  body.zz-fallback .zz-err { font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #b8532f; margin-bottom: 16px; }
  @media (prefers-color-scheme: dark) {
    body.zz-fallback { background: #141312; color: #ece7de; }
    body.zz-fallback p { color: #9b938a; }
    body.zz-fallback a { color: #e2a07a; }
    body.zz-fallback .zz-err { color: #e2a07a; }
  }
</style>
